{{- $title := .Title -}}
{{- $size := findRE `^mdocman-size-([0-9]+)x([0-9]+)$` $title -}}
<img src="{{ .Destination | safeURL }}" alt="{{ .PlainText }}"{{ if $size }} width="{{ replaceRE `^mdocman-size-([0-9]+)x([0-9]+)$` "$1" $title }}" height="{{ replaceRE `^mdocman-size-([0-9]+)x([0-9]+)$` "$2" $title }}"{{ else }}{{ with $title }} title="{{ . }}"{{ end }}{{ end }} loading="lazy">
